name: user_app
description: Astrobless — Customer app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.8.0+1

  # Local storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  pinput: ^5.0.0
  smooth_page_indicator: ^1.2.0+3

  # Icons
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.2
  gap: ^3.0.1
  collection: ^1.18.0
  uuid: ^4.5.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # Real-time (Socket.IO)
  socket_io_client: ^2.0.3+1

  # Voice / video calls
  agora_rtc_engine: ^6.3.2

  # Auth providers
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

  # Image & files
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^11.4.0

  # Location & Maps
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_maps_flutter: ^2.10.0

  # AI chat UI
  flutter_gen_ai_chat_ui: ^2.5.0

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
